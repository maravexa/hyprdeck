name        = "macOS Dock"
description = "Floating dock with icon magnification, inspired by macOS"

[[panels]]
edge     = "top"
height   = 28
layout   = "horizontal"
auto_hide = { mode = "disabled" }
modules_start  = ["menu_button", "hyprcube"]
modules_center = ["lunar"]
modules_end    = ["network", "clock", "calendar"]

[[panels]]
edge     = "bottom"
layout   = "dock"
auto_hide = { mode = "dock_hover", hover_margin = 20, hide_delay_ms = 800 }
modules_start  = []
modules_center = ["favorites", "window_list", "lunar"]
modules_end    = []

[panels.dock]
icon_base_size       = 48.0
icon_max_scale       = 1.8
magnification_radius = 150.0
animation_speed      = 8.0
padding              = 8.0
background_radius    = 16.0
background_opacity   = 0.6

[style]
background_color      = "#1e1e1eff"
foreground_color      = "#f0f0f0"
accent_color          = "#0a84ff"
urgent_color          = "#ff453a"
separator_color       = "#3a3a3a"
font_family           = "SF Pro Text"
font_size             = 11.0
border_radius         = 16.0
opacity               = 0.75
# Gap between icon and readout halves in verbose display mode (logical px).
# Verbose mode applies to modules on the top bar; modules in the dock layout
# use icon mode regardless of user config because the dock's magnification
# geometry assumes square icons.
verbose_text_padding  = 4.0
# Blank space between adjacent module slots (logical px).
# macOS menu bar has the most generous spacing of the five themes.
# The dock layout uses its own icon_gap field and ignores this value.
module_gap            = 6.0
