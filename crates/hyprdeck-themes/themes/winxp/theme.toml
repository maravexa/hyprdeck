name        = "Windows XP"
description = "Classic Windows XP taskbar with chunky buttons and teal start button"

[[panels]]
edge     = "bottom"
height   = 30
layout   = "horizontal"
auto_hide = { mode = "disabled" }
modules_start  = ["menu_button", "hyprcube", "favorites"]
modules_center = ["window_list"]
modules_end    = ["sound", "network", "clock", "power"]

[panels.module_styles.window_list]
active_background   = "#1c5ab5"
active_foreground   = "#ffffff"
inactive_background = "#3169c6"
inactive_foreground = "#ffffff"

[panels.module_styles.workspaces]
active_background   = "#1c5ab5"
active_foreground   = "#ffffff"
inactive_background = "#0a246a"
inactive_foreground = "#b0b0b0"

[style]
background_color      = "#245edb"
foreground_color      = "#ffffff"
accent_color          = "#3d8b37"
urgent_color          = "#ff8c00"
separator_color       = "#1a4ab0"
font_family           = "Tahoma"
font_size             = 11.0
border_radius         = 2.0
opacity               = 1.0
# Gap between icon and readout halves in verbose display mode (logical px).
# Defaults to bar_height / 8 when absent.
verbose_text_padding  = 3.0
# Blank space between adjacent module slots (logical px).
# XP taskbar is compact and dense; 2 px matches the original button spacing.
module_gap            = 2.0
