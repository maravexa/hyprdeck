name        = "Windows 7"
description = "Classic Windows 7 taskbar with translucent Aero glass effect"

[[panels]]
edge     = "bottom"
height   = 40
layout   = "horizontal"
auto_hide = { mode = "disabled" }
modules_start  = ["menu_button", "favorites", "window_list"]
#modules_center = ["window_list"]
modules_end    = ["sound", "network", "clock", "calendar", "power"]

[panels.module_styles.window_list]
active_background   = "#4580c8cc"
active_foreground   = "#ffffff"
inactive_background = "#2a5a9966"
inactive_foreground = "#e0e0e0"

[panels.module_styles.workspaces]
active_background   = "#4580c8"
active_foreground   = "#ffffff"
inactive_background = "#1c3b6e88"
inactive_foreground = "#c0c0c0"

[style]
background_color      = "#1a2a3a"
foreground_color      = "#ffffff"
accent_color          = "#3d7ab5"
urgent_color          = "#ff4444"
separator_color       = "#4a6a8a"
font_family           = "Segoe UI"
font_size             = 12.0
border_radius         = 3.0
opacity               = 0.85
# Gap between icon and readout halves in verbose display mode (logical px).
verbose_text_padding  = 4.0
# Blank space between adjacent module slots (logical px).
# Win7 Aero taskbar is more generous with spacing than XP.
module_gap            = 4.0
