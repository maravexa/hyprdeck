name        = "GNOME Left"
description = "Vertical left-side panel inspired by GNOME Shell overview, icon-only"

[[panels]]
edge     = "left"
width    = 48
layout   = "vertical"
auto_hide = { mode = "disabled" }
modules_start  = ["menu_button", "favorites"]
modules_center = ["workspaces"]
modules_end    = ["network", "clock"]

[style]
background_color = "#1a1a2e"
foreground_color = "#e0e0e0"
accent_color     = "#4a90d9"
urgent_color     = "#e74c3c"
separator_color  = "#2a2a4e"
font_family      = "Cantarell"
font_size        = 10.0
border_radius    = 4.0
opacity          = 0.95
