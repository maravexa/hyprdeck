[workspace]
resolver = "2"
members = [
    "crates/hyprdeck",
    "crates/hyprdeck-config",
    "crates/hyprdeck-core",
    "crates/hyprdeck-modules",
    "crates/hyprdeck-themes",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
authors = ["Mara Vexa"]
license = "MIT"
repository = "https://github.com/maravexa/hyprdeck"
readme = "README.md"

[workspace.dependencies]
hyprdeck-config  = { version = "0.1.0", path = "crates/hyprdeck-config" }
hyprdeck-core    = { version = "0.1.0", path = "crates/hyprdeck-core" }
hyprdeck-modules = { version = "0.1.0", path = "crates/hyprdeck-modules" }
hyprdeck-themes  = { version = "0.1.0", path = "crates/hyprdeck-themes" }

smithay-client-toolkit = { version = "0.21", default-features = false, features = ["xkbcommon"] }
wayland-client         = "0.31"

tiny-skia    = "0.12"
cosmic-text  = "0.19"
image        = { version = "0.25.10", default-features = false, features = ["png", "ico"] }
resvg        = { version = "0.48", default-features = false, features = ["text", "system-fonts", "raster-images"] }

tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "process", "signal"] }
# zbus 6 owns its wire types and derives; retain explicit Tokio/service features.
zbus = { version = "=6.3.0", default-features = false, features = ["tokio", "service", "proxy", "tracing", "unixexec"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml  = "1.1"
thiserror = "2"

tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

chrono    = { version = "0.4", features = ["serde"] }
reqwest   = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
nix       = { version = "0.31", features = ["net", "socket"] }
freedesktop-icons = "0.4"
include_dir       = "0.7"
