name        = "Classic GNOME"
description = "Traditional GNOME 2 layout with top and bottom panels"

[[panels]]
edge     = "top"
height   = 34
layout   = "horizontal"
auto_hide = { mode = "disabled" }
modules_start  = ["menu_button"]
modules_center = ["calendar", "clock"]
modules_end    = ["lunar", "sound", "network", "power"]

[panels.module_styles.window_list]
active_background   = "#4a90d9"
active_foreground   = "#ffffff"
inactive_background = "#3c3b3700"
inactive_foreground = "#eeeeec"

[[panels]]
edge     = "bottom"
height   = 34
layout   = "horizontal"
auto_hide = { mode = "disabled" }
modules_start  = ["window_list"]
modules_center = []
modules_end    = ["workspaces"]

[panels.module_styles.window_list]
active_background   = "#4a90d9"
active_foreground   = "#ffffff"
inactive_background = "#3c3b3700"
inactive_foreground = "#eeeeec"

[panels.module_styles.workspaces]
active_background   = "#4a90d9"
active_foreground   = "#ffffff"
inactive_background = "#3c3b37"
inactive_foreground = "#eeeeec"

[style]
background_color      = "#2e3436"
foreground_color      = "#eeeeec"
accent_color          = "#729fcf"
urgent_color          = "#cc0000"
separator_color       = "#555753"
font_family           = "Cantarell"
font_size             = 11.0
border_radius         = 0.0
opacity               = 1.0
# Gap between icon and readout halves in verbose display mode (logical px).
verbose_text_padding  = 3.0
