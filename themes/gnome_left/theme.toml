name        = "GNOME Left"
description = "Vertical left-side panel inspired by GNOME Shell overview, icon-only"

[[panels]]
edge     = "top"
height   = 28
layout   = "horizontal"
auto_hide = { mode = "disabled" }
modules_start  = ["workspaces"]
modules_center = ["clock"]
modules_end    = ["sound", "network", "calendar", "power"]

[panels.module_styles.workspaces]
active_background   = "#4a90d9"
active_foreground   = "#ffffff"
inactive_background = "#2d2d2d"
inactive_foreground = "#aaaaaa"

[[panels]]
edge     = "left"
width    = 48
layout   = "vertical"
auto_hide = { mode = "disabled" }
modules_start  = ["favorites"]
modules_center = []
modules_end    = ["sound", "power", "menu_button"]

[style]
background_color = "#1a1a2e"
foreground_color = "#e0e0e0"
accent_color     = "#4a90d9"
urgent_color     = "#e74c3c"
separator_color  = "#2a2a4e"
font_family      = "Cantarell"
font_size        = 10.0
border_radius    = 4.0
opacity          = 0.95
