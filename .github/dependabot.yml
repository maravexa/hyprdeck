version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # The @ref on this action selects the Rust toolchain version under
      # test; bumping it silently changes the MSRV gate (see the msrv job).
      - dependency-name: "dtolnay/rust-toolchain"
