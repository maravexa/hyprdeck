[workspace]
resolver = "2"
members = [
    "crates/hyprdeck",
    "crates/hyprdeck-core",
    "crates/hyprdeck-modules",
    "crates/hyprdeck-themes",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/maravexa/hyprdeck"

[workspace.dependencies]
hyprdeck-core    = { path = "crates/hyprdeck-core" }
hyprdeck-modules = { path = "crates/hyprdeck-modules" }
hyprdeck-themes  = { path = "crates/hyprdeck-themes" }

smithay-client-toolkit = "0.20"
wayland-client         = "0.31"

tiny-skia    = "0.11"
cosmic-text  = "0.12"
image        = { version = "0.25", default-features = false, features = ["png", "ico"] }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "process", "signal"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml  = "0.8"
thiserror = "2"

tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

chrono    = { version = "0.4", features = ["serde"] }
reqwest   = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
nix       = { version = "0.29", features = ["net", "socket"] }
freedesktop-icons = "0.2"
include_dir       = "0.7"
fn0rd             = "0.1"
